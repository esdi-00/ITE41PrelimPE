<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <h1>Patient Registration</h1>

        <form class="form-container" method="Post" action="home.html">

            <div class="">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
            </div>

            <div>
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
            </div>

            <div>
                <label for="email_address">Email:</label>
                <input type="email" id="email_address" name="email_address" placeholder="example@gmail.com" required>
            </div>

            <div>
                <label for="phone_number">Phone Number:</label>
                <input type="tel" id="phone_number" name="phone_number" value="+63">
            </div>

            <div>
                <label for="date_of_birth">Date of birth:</label>
                <input type="date" id="date_of_birth" name="date_of_birth" required>
            </div>

            <div class="form-select">
                <label for="gender">Gender:</label>
                <input type="radio" id="gender" name="gender" value="male">
                <label for="gender">Male</label>
                <input type="radio" id="gender" name="gender" value="female">
                <label for="gender">Female</label>
                <input type="radio" id="gender" name="gender" value="other">
                <label for="gender">Other</label> 
            </div>

            <div>
                <label for="department">Department:</label>
                <select name="department" id="department" >
                <option>Option:</option>
                <option value="Dentist">Dentist</option>
                <option value="Optometrist">Optometrist</option>
                <option value="General_Checkup">General Checkup</option>
                </select>
            </div>

            <div>
                <label for="message">Brief Symtoms:</label>
                <textarea name="message" id="message" rows="3" cols="50" placeholder="Something you can say...."></textarea>
            </div>

            <div>
                <button class ="submit-btn" type="submit">Submit</button>
                <button class ="cancel-btn" type="cancel">Cancel</button>
            </div>
        </form>
    </body>
</html>
